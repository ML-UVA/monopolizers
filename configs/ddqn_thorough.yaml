# DDQN-Hybrid Thorough Preset
# Larger buffer, slower decay — for full training runs

gamma: 0.999
lr: 5.0e-5
batch_size: 128
buffer_size: 500000
learning_starts: 5000
target_update_interval: 2000
train_freq: 4
eps_start: 1.0
eps_end: 0.02
eps_decay: 300000
hidden_dims: [256, 256]
grad_clip: 10.0
use_huber_loss: true

target_update_mode: hard
tau: 0.005

use_per: false
per_alpha: 0.6
per_beta_start: 0.4
per_beta_frames: 300000

reward_mode: dense_networth

reward_weights:
  delta_networth: 1.0
  buy_property: 0.1
  build: 0.05
  bankrupt: -1.0
  time_penalty: -0.001

normalize_rewards: false
reward_clip: 10.0

total_timesteps: 2000000
eval_interval: 200000
eval_episodes: 100
log_interval: 5000
save_interval: 100000
max_turns: 1000
seed: 42
